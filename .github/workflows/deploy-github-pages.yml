# Optional: publishes the site to GitHub Pages.
# Runs ONLY when started by hand (Actions tab -> "Deploy to GitHub Pages" -> Run workflow),
# so pushing code never changes the live site by itself.
# Before the first run: set siteUrl in src/config/siteConfig.ts to
#   https://<github-username>.github.io/<repository-name>
# and choose Settings -> Pages -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
